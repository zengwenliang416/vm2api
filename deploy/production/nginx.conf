server {
    listen 80;
    server_name vm2api.motion-cover.com;
    location ^~ /.well-known/acme-challenge/ { root /opt/vm2api/acme; }
    location / {
        if (-f /opt/vm2api/maintenance.flag) { return 503; }
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name vm2api.motion-cover.com;
    ssl_certificate /opt/vm2api/letsencrypt/live/vm2api.motion-cover.com/fullchain.pem;
    ssl_certificate_key /opt/vm2api/letsencrypt/live/vm2api.motion-cover.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/vm2api.access.log;
    error_log /var/log/nginx/vm2api.error.log warn;
    client_max_body_size 50m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~ /\.(git|env|htaccess|DS_Store) { return 404; }
    location = / { return 302 /console/; }
    location / {
        if (-f /opt/vm2api/maintenance.flag) { return 503; }
        proxy_pass http://127.0.0.1:3187;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vm2api_connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
